<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockIA.web — Profil établissement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="stockia-app page-profil">

<div class="stockia-shell">
    <aside id="stockia-sidebar-root" class="stockia-sidebar"></aside>
    <div class="stockia-main">
        <header class="stockia-topbar no-print d-flex align-items-center py-2 px-3">
            <span class="stockia-topbar-title h5 mb-0">Profil établissement</span>
        </header>

        <div class="container-fluid stockia-content px-3 px-lg-4 py-3 pb-5">
            <h1 class="h2">Coordonnées du point de vente</h1>

            <div id="erreur-profil" class="alert alert-danger d-none" role="alert"></div>
            <div id="succes-profil" class="alert alert-success d-none" role="status"></div>

            <form id="form-profil-etablissement" class="card shadow-sm no-print" style="max-width: 40rem;" novalidate>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label stockia-profil-label" for="profil-username">Identifiant de connexion :</label>
                        <input type="text" class="form-control stockia-profil-champ" id="profil-username" readonly disabled>
                        <div class="form-text">Vous ne pouvez pas changer cet identifiant ici.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label stockia-profil-label" for="profil-organization">Entreprise / Magasin :</label>
                        <input type="text" class="form-control stockia-profil-champ" id="profil-organization" maxlength="200" autocomplete="organization" aria-describedby="profil-feedback-org">
                        <div id="profil-feedback-org" class="small text-danger mt-1 d-none" role="alert"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label stockia-profil-label" for="profil-email">Adresse courriel professionnelle :</label>
                        <input type="text" class="form-control stockia-profil-champ" id="profil-email" maxlength="255" autocomplete="email" inputmode="email" aria-describedby="profil-feedback-email">
                        <div id="profil-feedback-email" class="small text-danger mt-1 d-none" role="alert"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label stockia-profil-label" for="profil-phone">Téléphone :</label>
                        <input type="text" class="form-control stockia-profil-champ" id="profil-phone" maxlength="40" autocomplete="tel" aria-describedby="profil-phone-help profil-feedback-phone">
                        <div id="profil-phone-help" class="form-text">Indicatif pays avec <strong>+</strong> (ex.&nbsp;: <strong>+1</strong>&nbsp;450&nbsp;555&nbsp;0100).</div>
                        <div id="profil-feedback-phone" class="small text-danger mt-1 d-none" role="alert"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label stockia-profil-label" for="profil-address">Adresse postale :</label>
                        <textarea class="form-control stockia-profil-champ" id="profil-address" maxlength="500" rows="2" autocomplete="street-address" aria-describedby="profil-feedback-address"></textarea>
                        <div id="profil-feedback-address" class="small text-danger mt-1 d-none" role="alert"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="client_api_rest_stockia.js"></script>
<script>window.STOCKIA_PAGE = "profil";</script>
<script src="layout_sidebar_stockia.js"></script>
<script src="interface_profil_etablissement.js"></script>
</body>
</html>
